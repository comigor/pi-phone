<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111315">
  <title>Pi Inbox</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <button id="home" class="brand" aria-label="Open inbox"><span class="brand-mark">π</span><span>Pi Inbox</span></button>
    <div class="topbar-actions">
      <span id="connection" class="connection">Connecting</span>
      <button id="notifications" class="icon-button" title="Enable notifications" aria-label="Enable notifications">Alerts</button>
    </div>
  </header>
  <div class="app-shell">
    <aside class="sidebar">
      <nav class="tabs" aria-label="Views">
        <button class="tab active" data-view="inbox">Inbox <span id="inbox-count" class="count">0</span></button>
        <button class="tab" data-view="agents">Agents <span id="agent-count" class="count">0</span></button>
      </nav>
      <div id="inbox-filter" class="inbox-filters" aria-label="Inbox filter">
        <button class="filter-button active" data-filter="pending">Unanswered</button>
        <button class="filter-button" data-filter="all">All</button>
      </div>
      <div id="sidebar-content"></div>
    </aside>
    <main id="main" class="main"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
